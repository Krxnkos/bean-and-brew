<html>
<head>
    <title>Book a Table</title>

</head>
<body>
    <head>
    <link rel="stylesheet" href="/styles/navbar.css">
</head>
<nav>
    <ul>
        <li><a href="/">Home</a></li>

    </ul>
</nav>

    <div class="booking-container">
        <h1>Make a Reservation</h1>
        
        <form id="bookingForm" class="booking-form">
            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" name="location" required>
                    <option value="Leeds">Leeds</option>
                    <option value="Harrogate">Harrogate</option>
                    <option value="Knaresborough Castle">Knaresborough Castle</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>

            <div class="form-group">
                <label for="guests">Number of Guests</label>
                <input type="number" id="guests" name="guests" min="1" max="8" required>
            </div>

            <button type="submit" class="btn btn-primary">Book Now</button>
        </form>

        <div id="bookingMessage" class="booking-message" style="display: none;"></div>
    </div>

    <script>
    document.getElementById('bookingForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const messageElement = document.getElementById('bookingMessage');
        
        try {
            const response = await fetch('/booking', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    location: document.getElementById('location').value,
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    guests: document.getElementById('guests').value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Booking failed');
            }

            messageElement.textContent = 'Booking successful!';
            messageElement.style.color = 'green';
            messageElement.style.display = 'block';
            
            event.target.reset();
        } catch (error) {
            messageElement.textContent = error.message;
            messageElement.style.color = 'red';
            messageElement.style.display = 'block';
        }
    });
    </script>
