name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build project
        run: |
          npm run build
          mkdir -p build/views/partials
          cp -r views/partials/* build/views/partials/
          cp -r static/* build/  # Copy static assets (CSS and images)
          cp CNAME build/ || true
        env:
          CI: false

      - name: List build directory
        run: ls -la build/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: beanandbrew.krxnkos.xyz
          force_orphan: true
          enable_jekyll: false
          full_commit_message: Deploy to GitHub Pages
